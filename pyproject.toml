[project]
name = "dnd-assistant"
version = "0.1.0"
description = "Live D&D table assistant: Discord transcription, Foundry events, local scribe notes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper",
    "pyaudiowpatch",
    "numpy",
    "aiohttp",
    "httpx",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.scripts]
dnd-assistant = "dnd_assistant.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-aiohttp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnd_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not gpu\""
markers = ["gpu: needs the RTX 4080 and the Whisper model"]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
